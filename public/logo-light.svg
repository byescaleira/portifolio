<svg viewBox="0 0 1300 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="by.escaleira">
  <title>by.escaleira</title>
  <!-- hard offset shadow (neubrutalist duplicate, no blur) -->
  <rect x="74" y="84" width="210" height="190" fill="#111111"/>
  <!-- accent block: solid orange, sharp corners, thick border -->
  <rect x="60" y="70" width="210" height="190" fill="#FF4D00" stroke="#111111" stroke-width="7"/>
  <!-- "by" reversed out of the block -->
  <text x="165" y="206" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="115" fill="#111111">by</text>
  <!-- wordmark: adaptive ink -->
  <text x="310" y="258" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="145" letter-spacing="-3" fill="#111111">.escaleira</text>
</svg>
