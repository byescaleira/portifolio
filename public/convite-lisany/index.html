<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>despedida da lisany — barcelona, chica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Chewy&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --coral:#F65B4E; --coral-deep:#D9382C; --ink:#0B0B0B;
    --morpho:#1D7FEA; --paper:#FFFFFF; --check:#D7D7D7; --sq:34px;
    --display:'Baloo 2','Trebuchet MS',sans-serif;
    --marker:'Chewy','Comic Sans MS',cursive;
    --mono:'Space Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--paper);color:var(--ink)}
  body{font-family:var(--marker);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}

  .checker{
    position:fixed;inset:0;z-index:0;background-color:var(--paper);
    background-image:
      linear-gradient(45deg,var(--check) 25%,transparent 25%,transparent 75%,var(--check) 75%),
      linear-gradient(45deg,var(--check) 25%,transparent 25%,transparent 75%,var(--check) 75%);
    background-size:calc(var(--sq)*2) calc(var(--sq)*2);
    background-position:0 0,var(--sq) var(--sq);
    opacity:0;animation:fadeIn .5s ease forwards;
  }

  .stage{position:relative;z-index:2;max-width:1120px;margin:0 auto;padding:clamp(26px,5vw,60px) clamp(18px,4vw,48px) 0}

  .eyebrow{
    font-family:var(--mono);font-weight:700;font-size:clamp(11px,1.4vw,14px);
    letter-spacing:.42em;text-transform:uppercase;opacity:0;
    animation:riseIn .6s .15s ease forwards;
  }
  .title{
    font-family:var(--display);font-weight:800;
    font-size:clamp(46px,11.4vw,134px);line-height:.86;letter-spacing:-.028em;
    text-transform:uppercase;color:var(--coral);margin:.12em 0 .1em;transform:rotate(-2.2deg);
    text-shadow:
      0 0 10px var(--paper),0 0 10px var(--paper),
      2px 2px 0 var(--paper),-2px 2px 0 var(--paper),
      2px -2px 0 var(--paper),-2px -2px 0 var(--paper),
      6px 7px 0 rgba(11,11,11,.14);
  }
  .title span{display:block;opacity:0;transform:translateY(38px) rotate(3deg)}
  .title span:nth-child(1){animation:dropIn .78s .2s cubic-bezier(.2,1.5,.4,1) forwards}
  .title span:nth-child(2){animation:dropIn .78s .34s cubic-bezier(.2,1.5,.4,1) forwards}

  .tag{font-size:clamp(19px,3.2vw,34px);opacity:0;animation:riseIn .6s .6s ease forwards}
  .tag em{
    font-style:normal;color:var(--paper);background:var(--ink);
    padding:.06em .34em .14em;border-radius:.2em;display:inline-block;transform:rotate(-1.4deg);
  }

  .facts{
    display:grid;grid-template-columns:repeat(3,1fr);
    gap:clamp(12px,2vw,22px);margin-top:clamp(26px,4vw,44px);
  }
  .fact{
    background:var(--paper);border:3px solid var(--ink);border-radius:14px;
    padding:clamp(13px,2vw,20px) clamp(14px,2.2vw,22px);
    box-shadow:7px 8px 0 rgba(11,11,11,.9);
    opacity:0;transform:translateY(24px);
    transition:transform .22s ease,box-shadow .22s ease;
  }
  .fact:nth-child(1){--tilt:-1.6deg;animation:stick .55s .74s ease forwards}
  .fact:nth-child(2){--tilt:1.2deg;animation:stick .55s .86s ease forwards}
  .fact:nth-child(3){--tilt:-.9deg;animation:stick .55s .98s ease forwards}
  .fact:hover{transform:rotate(var(--tilt)) translate(-3px,-4px) scale(1.02);box-shadow:12px 13px 0 var(--coral)}

  .fact-key{
    font-family:var(--mono);font-weight:700;font-size:clamp(10px,1.2vw,12px);
    letter-spacing:.32em;text-transform:uppercase;color:var(--coral-deep);
    display:block;margin-bottom:.36em;
  }
  .fact-val{font-size:clamp(18px,2.5vw,28px);line-height:1.14}
  .fact-val small{
    display:block;font-family:var(--mono);font-size:clamp(10px,1.2vw,12px);
    letter-spacing:.03em;opacity:.6;margin-top:.55em;line-height:1.5;
  }

  .cta{
    margin-top:clamp(26px,4vw,42px);display:flex;flex-wrap:wrap;align-items:center;
    gap:clamp(13px,2.2vw,24px);opacity:0;animation:riseIn .6s 1.1s ease forwards;
  }
  .rsvp{
    font-family:var(--display);font-weight:800;font-size:clamp(21px,3.2vw,32px);
    letter-spacing:-.02em;color:var(--paper);background:var(--coral);
    border:3px solid var(--ink);border-radius:999px;padding:.42em 1.15em .5em;
    cursor:pointer;box-shadow:7px 8px 0 var(--ink);
    transition:transform .16s ease,box-shadow .16s ease,background .16s ease;
  }
  .rsvp:hover{transform:translate(-3px,-4px);box-shadow:11px 13px 0 var(--ink)}
  .rsvp:active{transform:translate(4px,5px);box-shadow:2px 2px 0 var(--ink)}
  .rsvp:focus-visible{outline:4px solid var(--morpho);outline-offset:6px}
  .rsvp.done{background:var(--ink)}
  .ics{
    font-family:var(--mono);font-size:clamp(12px,1.5vw,14px);letter-spacing:.05em;
    color:var(--ink);text-decoration-thickness:2px;text-underline-offset:5px;
  }
  .ics:hover{color:var(--coral-deep)}
  .countdown{
    font-family:var(--mono);font-weight:700;font-size:clamp(12px,1.5vw,14px);
    letter-spacing:.2em;text-transform:uppercase;margin-left:auto;
    background:var(--paper);border:2px solid var(--ink);border-radius:999px;padding:.6em 1.1em;
  }

  /* ---------- faixa de fotos ---------- */
  .band{
    position:relative;z-index:2;margin-top:clamp(18px,3vw,34px);
    height:clamp(300px,48vw,580px);
    display:flex;align-items:flex-end;justify-content:center;
  }
  .scrawl{position:absolute;left:0;right:0;bottom:18%;width:100%;height:34%;pointer-events:none;overflow:visible}
  .scrawl path{
    fill:none;stroke:var(--coral);stroke-width:34;stroke-linecap:round;stroke-linejoin:round;
    opacity:.5;stroke-dasharray:1500;stroke-dashoffset:1500;
    animation:draw 1.6s 1s cubic-bezier(.6,0,.3,1) forwards;
  }
  .fig{
    position:relative;height:52%;width:auto;display:block;cursor:pointer;
    background:none;border:none;padding:0;
    opacity:0;transform:translateY(70px);
    filter:drop-shadow(9px 11px 0 rgba(11,11,11,.13));
  }
  .fig img{height:100%;width:auto;display:block;pointer-events:none}
  .fig:focus-visible{outline:4px solid var(--morpho);outline-offset:8px;border-radius:12px}
  .fig-a{height:53%;margin-right:-3%;z-index:2;animation:standUp .7s 1.15s cubic-bezier(.2,1.3,.4,1) forwards}
  .fig-b{height:100%;z-index:3;animation:standUp .7s 1.3s cubic-bezier(.2,1.3,.4,1) forwards}
  .fig-c{height:51%;margin-left:-3%;z-index:2;animation:standUp .7s 1.45s cubic-bezier(.2,1.3,.4,1) forwards}
  .fig-a.sway{animation:standUp .7s 1.15s cubic-bezier(.2,1.3,.4,1) forwards,sway 6.5s 2s ease-in-out infinite}
  .fig-b.sway{animation:standUp .7s 1.3s cubic-bezier(.2,1.3,.4,1) forwards,sway 8s 2.2s ease-in-out infinite}
  .fig-c.sway{animation:standUp .7s 1.45s cubic-bezier(.2,1.3,.4,1) forwards,sway 7.2s 2.4s ease-in-out infinite}
  .fig.knock{animation:knock .5s ease !important}

  .band-hint{
    position:relative;z-index:4;text-align:center;font-family:var(--mono);
    font-size:11px;letter-spacing:.26em;text-transform:uppercase;
    padding:0 0 clamp(20px,4vw,34px);opacity:0;animation:riseIn .6s 1.9s ease forwards;
  }
  .band-hint b{color:var(--coral-deep);font-weight:700}

  /* ---------- borboletas ---------- */
  .bf{position:fixed;z-index:5;width:56px;pointer-events:none;will-change:transform}
  .bf .wing{transform-box:fill-box;transform-origin:right center;animation:flap .34s infinite ease-in-out}
  .bf .wing.r{transform-origin:left center;animation-delay:.02s}
  .bf.drift-1{top:8%;left:-8%;animation:drift1 27s linear infinite}
  .bf.drift-2{top:58%;left:104%;width:44px;animation:drift2 33s linear infinite 3s}
  .bf.drift-3{top:80%;left:-8%;width:38px;animation:drift3 23s linear infinite 6s}
  .bf.burst{position:fixed;width:40px;animation:burst 1.5s cubic-bezier(.2,.7,.3,1) forwards}

  @keyframes fadeIn{to{opacity:1}}
  @keyframes riseIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  @keyframes dropIn{to{opacity:1;transform:translateY(0) rotate(0)}}
  @keyframes stick{to{opacity:1;transform:rotate(var(--tilt)) translateY(0)}}
  @keyframes standUp{to{opacity:1;transform:translateY(0)}}
  @keyframes sway{0%,100%{transform:rotate(-.9deg) translateY(0)}50%{transform:rotate(.9deg) translateY(-7px)}}
  @keyframes knock{0%,100%{transform:rotate(0) scale(1)}30%{transform:rotate(3deg) scale(1.03)}65%{transform:rotate(-4deg) scale(.99)}}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes flap{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.24)}}
  @keyframes drift1{0%{transform:translate(0,0) rotate(8deg)}50%{transform:translate(58vw,24vh) rotate(-14deg)}100%{transform:translate(120vw,-6vh) rotate(10deg)}}
  @keyframes drift2{0%{transform:translate(0,0) rotate(-160deg)}50%{transform:translate(-55vw,-28vh) rotate(-200deg)}100%{transform:translate(-118vw,8vh) rotate(-165deg)}}
  @keyframes drift3{0%{transform:translate(0,0) rotate(-8deg)}50%{transform:translate(52vw,-32vh) rotate(16deg)}100%{transform:translate(118vw,4vh) rotate(-6deg)}}
  @keyframes burst{0%{transform:translate(0,0) scale(.4) rotate(0);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1) rotate(var(--dr));opacity:0}}

  @media (max-width:760px){
    :root{--sq:24px}
    .facts{grid-template-columns:1fr}
    .countdown{margin-left:0;width:100%;text-align:center}
    .band{height:clamp(260px,62vw,420px)}
    .scrawl path{stroke-width:44}
  }

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
    .checker,.eyebrow,.tag,.cta,.band-hint{opacity:1}
    .title span{opacity:1;transform:none}
    .fact{opacity:1;transform:rotate(var(--tilt))}
    .fig{opacity:1;transform:none}
    .scrawl path{stroke-dashoffset:0}
    .bf{display:none}
  }
</style>
</head>

<main class="stage">

  <h1 class="title"><span>despedida</span><span>da lisany</span></h1>

  <section class="facts">

      <span class="fact-key">local</span>

    <div class="fact">

  tick(); setInterval(tick, 30000);

  function stamp(dt){

    'DTSTART:'+stamp(START),'DTEND:'+stamp(END),
    'SUMMARY:Despedida da Lisany','LOCATION:Jardim Central - Rua Paraíba, 574',
    'DESCRIPTION:Para onde? Barcelona, chica. A partir das 16:00.',
    'END:VEVENT','END:VCALENDAR'].join('\r\n'));

  function swarm(x, y, count){
    if (reduced) return;
    for (var i = 0; i < count; i++){
      var b = document.createElementNS('http://www.w3.org/2000/svg','svg');
      b.setAttribute('viewBox','-52 -42 104 84');
      b.setAttribute('class','bf burst');
      b.setAttribute('aria-hidden','true');
      var u = document.createElementNS('http://www.w3.org/2000/svg','use');
      u.setAttribute('href','#morpho'); b.appendChild(u);
      var ang = (Math.PI*2*i)/count + Math.random()*.5, dist = 120 + Math.random()*240;
      b.style.left = (x-20)+'px'; b.style.top = (y-20)+'px';
      b.style.setProperty('--dx', Math.cos(ang)*dist+'px');
      b.style.setProperty('--dy', (Math.sin(ang)*dist-110)+'px');
      b.style.setProperty('--dr', (Math.random()*700-350)+'deg');
      b.style.animationDelay = (Math.random()*.18)+'s';
      document.body.appendChild(b);
      setTimeout(function(node){ return function(){ node.remove(); }; }(b), 1900);
    }
  }
  function centerOf(el){ var r = el.getBoundingClientRect(); return {x:r.left+r.width/2, y:r.top+r.height/2}; }

  Array.prototype.forEach.call(document.querySelectorAll('.fig'), function(fig){
    fig.addEventListener('click', function(){
      var c = centerOf(fig); swarm(c.x, c.y, 12);
      if (reduced) return;
      fig.classList.remove('knock'); void fig.offsetWidth; fig.classList.add('knock');
      setTimeout(function(){ fig.classList.remove('knock'); }, 520);
    });
  });

  var rsvp = document.getElementById('rsvp'), done = false;
  rsvp.addEventListener('click', function(){
    var c = centerOf(rsvp); swarm(c.x, c.y, 20);
    if (done) return;
    done = true; rsvp.textContent = 'boa, chica ✦'; rsvp.classList.add('done');
  });
})();
</script>
</body>
</html>
